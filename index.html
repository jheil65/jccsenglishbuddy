<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English Buddy</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes popIn {
            0% { opacity: 0; transform: scale(0.92) translateY(8px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }
        .animate-fade-in { animation: fadeIn 0.4s ease-out forwards; }
        .animate-pop-in { animation: popIn 0.35s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-slate-50 h-screen overflow-hidden text-slate-900 font-sans">
    <div id="root" class="h-full"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useCallback } = React;

        // --- ICONS ---
        const IconBase = ({ size = 24, className = "", children }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                {children}
            </svg>
        );
        const Mic = (p) => <IconBase {...p}><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></IconBase>;
        const Send = (p) => <IconBase {...p}><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></IconBase>;
        const Globe = (p) => <IconBase {...p}><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></IconBase>;
        const ArrowLeft = (p) => <IconBase {...p}><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></IconBase>;
        const Sparkles = (p) => <IconBase {...p}><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/></IconBase>;
        const AlertCircle = (p) => <IconBase {...p}><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></IconBase>;
        const CheckCircle = (p) => <IconBase {...p}><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></IconBase>;
        const RefreshCw = (p) => <IconBase {...p}><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></IconBase>;
        const Coffee = (p) => <IconBase {...p}><path d="M18 8h1a4 4 0 0 1 0 8h-1"/><path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z"/><line x1="6" y1="1" x2="6" y2="4"/><line x1="10" y1="1" x2="10" y2="4"/><line x1="14" y1="1" x2="14" y2="4"/></IconBase>;
        const Shirt = (p) => <IconBase {...p}><path d="M20.38 3.46 16 2a4 4 0 0 1-8 0L3.62 3.46a2 2 0 0 0-1.34 2.23l.58 3.47a1 1 0 0 0 .99.84H6v10c0 1.1.9 2 2 2h8a2 2 0 0 0 2-2V10h2.15a1 1 0 0 0 .99-.84l.58-3.47a2 2 0 0 0-1.34-2.23z"/></IconBase>;
        const Plane = (p) => <IconBase {...p}><path d="M17.8 19.2 16 11l3.5-3.5C21 6 21 4 19 4c-1 0-2 .5-3.5 2L12 9.8 4.8 8C4.4 7.8 4 8 3.8 8.4l-.3.7c-.3.6-.1 1.3.4 1.7L8 12l-2 3H4l-1 1 3 2 2 3 1-1v-2l3-2 3.5 3.5c.5.5 1.2.7 1.8.4l.7-.3c.5-.2.7-.6.5-1z"/></IconBase>;
        const Camera = (p) => <IconBase {...p}><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></IconBase>;
        const Tv = (p) => <IconBase {...p}><rect x="2" y="7" width="20" height="15" rx="2" ry="2"/><polyline points="17 2 12 7 7 2"/></IconBase>;
        const Music = (p) => <IconBase {...p}><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></IconBase>;
        const MessageCircle = (p) => <IconBase {...p}><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></IconBase>;
        const Gamepad = (p) => <IconBase {...p}><line x1="6" y1="12" x2="10" y2="12"/><line x1="8" y1="10" x2="8" y2="14"/><line x1="15" y1="13" x2="15.01" y2="13"/><line x1="18" y1="11" x2="18.01" y2="11"/><rect x="2" y="6" width="20" height="12" rx="2"/></IconBase>;
        const Star = (p) => <IconBase {...p}><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></IconBase>;

        // --- CONFIGURATION ---
        const TOPICS = [
            { id: 'assessment', label: 'Start Here (Level Check)', icon: Star, color: 'bg-yellow-100 text-yellow-600', prompt: "Hey! I'm English Buddy. What's your name? 😊" },
            { id: 'entertainment', label: 'Netflix & Anime', icon: Tv, color: 'bg-red-100 text-red-600', prompt: "Let's talk shows! Are you watching anything good right now — any anime or series?" },
            { id: 'sports', label: 'Sports & Gaming', icon: Gamepad, color: 'bg-emerald-100 text-emerald-600', prompt: "Okay — real talk. Gaming or sports? Which one do you like more?" },
            { id: 'music', label: 'Music & Vibes', icon: Music, color: 'bg-teal-100 text-teal-600', prompt: "What have you been listening to lately? Tell me your favorite artist right now." },
            { id: 'food', label: 'Snacks & Food', icon: Coffee, color: 'bg-orange-100 text-orange-600', prompt: "If you could eat anything right now — anything at all — what would you pick?" },
            { id: 'fashion', label: 'Style & Trends', icon: Shirt, color: 'bg-pink-100 text-pink-600', prompt: "What's your style like? Are you more into sneakers, hoodies, or something else?" },
            { id: 'travel', label: 'Dream Trips', icon: Plane, color: 'bg-blue-100 text-blue-600', prompt: "If you could go anywhere tomorrow with your friends, where would you go?" },
            { id: 'hobbies', label: 'Hobbies', icon: Camera, color: 'bg-purple-100 text-purple-600', prompt: "What do you like to do when school is done? Tell me about something you enjoy." },
            { id: 'daily', label: 'School & Friends', icon: MessageCircle, color: 'bg-indigo-100 text-indigo-600', prompt: "How's school going lately? What's been the best — or worst — part of your week?" },
        ];

        const MAX_TURNS = 10;

        // ─────────────────────────────────────────────────────────────────────
        // FIX #1: WARM, NATURAL SYSTEM PROMPT — no robotic rule lists
        // ─────────────────────────────────────────────────────────────────────
        const buildSystemPrompt = (topicLabel) => `
You are English Buddy — a warm, patient, funny English conversation partner for high school students who are learning English. Most of your students speak Spanish at home.

Your whole job is to keep a natural, friendly conversation going about: ${topicLabel}

HOW YOU TALK:
Keep your responses short — just 1 to 3 sentences. Sound like a real person texting a friend, not a teacher grading a paper. Use contractions, casual phrasing, and occasional humor. Never sound formal or stiff.

WHEN THE STUDENT SPEAKS SPANISH:
Celebrate it! Briefly echo what they said in English so they hear the translation naturally, then respond to what they actually said and keep the conversation moving. Don't make a big deal out of it — just weave the English in warmly.

WHEN THE STUDENT MAKES AN ENGLISH MISTAKE:
Don't correct them directly — that kills confidence. Instead, naturally use the correct form in your own reply so they hear it modeled. For example, if they say "I go yesterday to the store", you say "Oh nice, you went to the store! What did you get?" Keep it breezy.

MOST IMPORTANT RULE:
Ask only ONE question at a time. Never stack two questions together. Wait for their answer before asking the next thing. This is non-negotiable — one question, then listen.

LEVEL MATCHING:
If the student is struggling or mostly using Spanish, simplify your English. Use shorter words, shorter sentences. If they're confident in English, match their energy and raise the level a little.

YOUR PERSONALITY:
Encouraging, genuine, a little playful. You're rooting for them. You notice when they do something well and you say so naturally ("Ha, that's a great word for it!"). Never condescending, never clinical.
`;

        // ─────────────────────────────────────────────────────────────────────
        // FIX #2: RICH, WARM FEEDBACK PROMPT — not a blunt system tag
        // ─────────────────────────────────────────────────────────────────────
        const buildFeedbackPrompt = (conversationHistory) => `
You are English Buddy. This student just finished a 10-message conversation with you. Now it's time to give them their progress report.

Here's what was said:
${conversationHistory}

Write a warm, encouraging feedback message. Keep it conversational — like a coach at the end of a practice, not a teacher grading a paper.

Structure it like this (but write it as natural flowing text, NOT as a bulleted list or numbered list):

1. Start with one genuine thing they did well — be specific, not generic. Name something real from the conversation.
2. Give one gentle, actionable tip they can try next time. Frame it as something exciting to try, not a correction.
3. End with something encouraging that makes them want to come back and talk again.

Keep the whole thing under 120 words. Sound warm, real, and human. If they mostly spoke Spanish, celebrate that they showed up and tried — that takes courage. If they used English well, be genuinely impressed.
`;

        // --- SUB-COMPONENTS ---

        const TopicCard = ({ topic, onSelect }) => (
            <button
                onClick={() => onSelect(topic)}
                className="flex flex-col items-center justify-center p-6 rounded-2xl shadow-sm hover:shadow-md transition-all duration-300 border border-slate-100 hover:-translate-y-1 bg-white group"
            >
                <div className={`p-4 rounded-full mb-4 ${topic.color} group-hover:opacity-80 transition-opacity`}>
                    <topic.icon size={32} strokeWidth={1.5} />
                </div>
                <span className="font-semibold text-slate-700 text-lg">{topic.label}</span>
            </button>
        );

        const ChatBubble = ({ message, onRetry }) => {
            const isUser = message.sender === 'user';
            const isError = message.isError;
            const isFeedback = message.isFeedback;

            return (
                <div className={`flex w-full mb-4 animate-pop-in ${isUser ? 'justify-end' : 'justify-start'}`}>
                    <div className={`max-w-[85%] sm:max-w-[75%] p-4 rounded-2xl shadow-sm text-base leading-relaxed
                        ${isUser
                            ? 'bg-blue-600 text-white rounded-br-none'
                            : isFeedback
                                ? 'bg-emerald-50 border border-emerald-200 text-emerald-900 rounded-bl-none'
                                : isError
                                    ? 'bg-red-50 border border-red-200 text-red-800 rounded-bl-none'
                                    : 'bg-white border border-slate-100 text-slate-800 rounded-bl-none'
                        }`}
                    >
                        {message.contextLabel && !isError && !isFeedback && (
                            <p className="text-xs font-bold mb-1 opacity-60 uppercase tracking-wider">{message.contextLabel}</p>
                        )}
                        {isFeedback && (
                            <div className="flex items-center gap-2 mb-2 text-emerald-600 font-bold text-sm uppercase tracking-wide">
                                <CheckCircle size={16} />
                                <span>Your Progress Report</span>
                            </div>
                        )}
                        {isError && (
                            <div className="flex items-center gap-2 mb-2 text-red-600 font-bold text-sm uppercase tracking-wide">
                                <AlertCircle size={16} />
                                <span>Connection Blip</span>
                            </div>
                        )}
                        <p className="whitespace-pre-wrap">{message.text}</p>
                        {isError && onRetry && (
                            <button
                                onClick={onRetry}
                                className="mt-3 bg-red-100 hover:bg-red-200 text-red-700 text-xs font-bold py-2 px-4 rounded-lg flex items-center gap-2 transition-colors"
                            >
                                <RefreshCw size={14} /> Try Again
                            </button>
                        )}
                        {message.correction && (
                            <div className="mt-3 pt-3 border-t border-slate-200">
                                <div className="flex items-start gap-2">
                                    <Sparkles size={16} className={isUser ? "text-yellow-300" : "text-amber-500"} />
                                    <p className="text-sm italic opacity-90">{message.correction}</p>
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        const WelcomeView = ({ apiKey, setApiKey, setHasKey, setView, selectedModel, setSelectedModel, testConnection, testStatus }) => {
            const lastFour = apiKey.length > 4 ? apiKey.slice(-4) : "None";
            return (
                <div className="flex flex-col items-center justify-center min-h-[60vh] text-center p-6 animate-fade-in">
                    <div className="bg-blue-100 p-6 rounded-full mb-6">
                        <Globe size={64} className="text-blue-600" />
                    </div>
                    <h1 className="text-4xl font-bold text-slate-800 mb-4 tracking-tight">English Buddy</h1>
                    <p className="text-lg text-slate-500 max-w-md mb-8">Your supportive companion for learning English.</p>
                    <div className="bg-white p-6 rounded-2xl shadow-lg border border-slate-100 w-full max-w-md text-left">
                        <label className="block text-sm font-semibold text-slate-700 mb-2">Google Gemini API Key</label>
                        <input
                            type="password"
                            value={apiKey}
                            onChange={(e) => setApiKey(e.target.value)}
                            placeholder="Paste key here..."
                            className="w-full p-3 border border-slate-300 rounded-lg mb-4 focus:ring-2 focus:ring-blue-500 outline-none"
                        />
                        <label className="block text-sm font-semibold text-slate-700 mb-2">AI Model</label>
                        <select
                            value={selectedModel}
                            onChange={(e) => setSelectedModel(e.target.value)}
                            className="w-full p-3 border border-slate-300 rounded-lg mb-4 bg-slate-50 focus:ring-2 focus:ring-blue-500 outline-none"
                        >
                            <option value="gemini-2.5-flash">Gemini 2.5 Flash (Recommended)</option>
                            <option value="gemini-2.0-flash">Gemini 2.0 Flash</option>
                            <option value="gemini-1.5-flash">Gemini 1.5 Flash</option>
                            <option value="gemini-1.5-pro">Gemini 1.5 Pro</option>
                        </select>
                        <div className="flex gap-2 mb-4">
                            <button onClick={testConnection} className="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold py-3 rounded-xl border border-slate-300 transition-colors">
                                Test Key
                            </button>
                            <button
                                onClick={() => {
                                    if (apiKey.length > 10) { setHasKey(true); setView('topics'); }
                                    else alert("Please enter a valid API key.");
                                }}
                                className="flex-1 bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl shadow-lg transition-colors"
                            >
                                Start
                            </button>
                        </div>
                        {testStatus && (
                            <div className={`text-xs text-center font-bold p-2 rounded mb-2 ${testStatus.includes("Success") ? "bg-green-100 text-green-700" : "bg-red-100 text-red-700"}`}>
                                {testStatus}
                            </div>
                        )}
                        <div className="text-xs text-right text-slate-300 font-mono">Key: ...{lastFour}</div>
                    </div>
                </div>
            );
        };

        const TopicsView = ({ setView, setHasKey, setCurrentTopic, setMessages, speakText, setTurnCount }) => (
            <div className="p-4 sm:p-8 max-w-5xl mx-auto animate-fade-in h-full overflow-y-auto scrollbar-hide">
                <div className="flex items-center justify-between mb-8">
                    <div>
                        <h2 className="text-3xl font-bold text-slate-800">Choose a Topic</h2>
                        <p className="text-slate-500">What would you like to talk about today?</p>
                    </div>
                    <button onClick={() => { setHasKey(false); setView('welcome'); }} className="text-slate-400 hover:text-slate-600 text-sm">
                        Change Key
                    </button>
                </div>
                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 pb-12">
                    {TOPICS.map((topic) => (
                        <TopicCard
                            key={topic.id}
                            topic={topic}
                            onSelect={(t) => {
                                setCurrentTopic(t);
                                setTurnCount(0);
                                setMessages([{ id: 'init', sender: 'ai', text: t.prompt }]);
                                speakText(t.prompt, 'en');
                                setView('chat');
                            }}
                        />
                    ))}
                </div>
            </div>
        );

        const ChatView = ({
            turnCount, MAX_TURNS, currentTopic, messages, isLoading, statusMessage,
            isListening, listeningLang, startListening, inputText, setInputText,
            handleSendMessage, setView, currentModel, setModel
        }) => {
            const isSessionDone = turnCount >= MAX_TURNS;
            const chatEndRef = useRef(null);

            useEffect(() => {
                chatEndRef.current?.scrollIntoView({ behavior: 'smooth' });
            }, [messages]);

            const retryLastMessage = () => {
                const lastUserMsg = [...messages].reverse().find(m => m.sender === 'user');
                if (lastUserMsg) handleSendMessage(lastUserMsg.text, false, true);
            };

            return (
                <div className="flex flex-col h-screen max-h-screen bg-slate-50">
                    {/* Model switcher */}
                    <div className="absolute top-2 right-2 z-50">
                        <select
                            value={currentModel}
                            onChange={(e) => setModel(e.target.value)}
                            className="bg-white border border-slate-200 text-slate-500 text-xs rounded px-2 py-1 shadow-sm opacity-40 hover:opacity-100 transition-opacity"
                        >
                            <option value="gemini-2.5-flash">2.5 Flash</option>
                            <option value="gemini-2.0-flash">2.0 Flash</option>
                            <option value="gemini-1.5-flash">1.5 Flash</option>
                            <option value="gemini-1.5-pro">1.5 Pro</option>
                        </select>
                    </div>

                    {/* Header */}
                    <div className="bg-white border-b border-slate-200 p-4 flex items-center justify-between shadow-sm z-10">
                        <div className="flex items-center gap-3">
                            <button onClick={() => { window.speechSynthesis.cancel(); setView('topics'); }} className="p-2 hover:bg-slate-100 rounded-full text-slate-500 transition-colors">
                                <ArrowLeft size={24} />
                            </button>
                            <div className="flex items-center gap-2">
                                <div className={`p-2 rounded-full ${currentTopic.color}`}>
                                    <currentTopic.icon size={20} />
                                </div>
                                <div>
                                    <h3 className="font-bold text-slate-800 leading-tight">{currentTopic.label}</h3>
                                    <p className="text-xs text-slate-500">{isSessionDone ? "Session Complete!" : "English Buddy is here"}</p>
                                </div>
                            </div>
                        </div>
                        <div className="flex flex-col items-end mr-8">
                            <div className="text-xs font-bold text-slate-400 mb-1">Turn {Math.min(turnCount, MAX_TURNS)}/{MAX_TURNS}</div>
                            <div className="w-24 h-2 bg-slate-100 rounded-full overflow-hidden">
                                <div className="h-full bg-blue-500 transition-all duration-500" style={{ width: `${Math.min((turnCount / MAX_TURNS) * 100, 100)}%` }}></div>
                            </div>
                        </div>
                    </div>

                    {/* Messages */}
                    <div className="flex-1 overflow-y-auto p-4 sm:p-6 scrollbar-hide">
                        {messages.map((msg) => (
                            <ChatBubble key={msg.id} message={msg} onRetry={retryLastMessage} />
                        ))}
                        {isLoading && (
                            <div className="flex justify-start w-full mb-4">
                                <div className="bg-white p-4 rounded-2xl rounded-bl-none shadow-sm border border-slate-100 flex gap-2 items-center">
                                    <div className="w-2 h-2 bg-slate-400 rounded-full animate-bounce" style={{ animationDelay: '0ms' }}></div>
                                    <div className="w-2 h-2 bg-slate-400 rounded-full animate-bounce" style={{ animationDelay: '150ms' }}></div>
                                    <div className="w-2 h-2 bg-slate-400 rounded-full animate-bounce" style={{ animationDelay: '300ms' }}></div>
                                </div>
                            </div>
                        )}
                        <div ref={chatEndRef} />
                    </div>

                    {/* Input Area */}
                    <div className="bg-white border-t border-slate-200 p-4 pb-6">
                        <div className="max-w-3xl mx-auto space-y-3">
                            {isSessionDone ? (
                                <div className="text-center py-4">
                                    <h3 className="text-xl font-bold text-slate-800 mb-2">Great Job! 🎉</h3>
                                    <p className="text-slate-500 mb-4">You finished this conversation — that's awesome!</p>
                                    <button
                                        onClick={() => { window.speechSynthesis.cancel(); setView('topics'); }}
                                        className="bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-8 rounded-xl shadow-lg transition-all transform hover:scale-105"
                                    >
                                        Start New Topic
                                    </button>
                                </div>
                            ) : (
                                <>
                                    <div className="h-5 flex items-center justify-center">
                                        {statusMessage && (
                                            <p className={`text-xs font-semibold ${statusMessage.includes('Error') || statusMessage.includes('No speech') ? 'text-red-500' : 'text-blue-600 animate-pulse'}`}>
                                                {statusMessage}
                                            </p>
                                        )}
                                    </div>
                                    <div className="flex gap-2 justify-center">
                                        <button
                                            onClick={() => startListening('en-US')}
                                            disabled={isListening || isLoading}
                                            className={`flex-1 flex flex-col items-center justify-center p-4 rounded-xl border-2 transition-all
                                                ${isListening && listeningLang === 'en-US'
                                                    ? 'border-red-500 bg-red-50 text-red-600 animate-pulse'
                                                    : 'border-blue-100 bg-blue-50 text-blue-700 hover:bg-blue-100'}`}
                                        >
                                            <Mic size={24} className="mb-1" />
                                            <span className="text-xs font-bold">Speak English</span>
                                        </button>
                                        <button
                                            onClick={() => startListening('es-MX')}
                                            disabled={isListening || isLoading}
                                            className={`flex-1 flex flex-col items-center justify-center p-4 rounded-xl border-2 transition-all
                                                ${isListening && listeningLang === 'es-MX'
                                                    ? 'border-red-500 bg-red-50 text-red-600 animate-pulse'
                                                    : 'border-orange-100 bg-orange-50 text-orange-700 hover:bg-orange-100'}`}
                                        >
                                            <Globe size={24} className="mb-1" />
                                            <span className="text-xs font-bold">Ayuda en Español</span>
                                        </button>
                                    </div>
                                    <form onSubmit={(e) => { e.preventDefault(); handleSendMessage(inputText); }} className="flex gap-2">
                                        <input
                                            type="text"
                                            value={inputText}
                                            onChange={(e) => setInputText(e.target.value)}
                                            placeholder="Or type your message here..."
                                            className="flex-1 p-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none"
                                            disabled={isLoading}
                                            autoFocus
                                        />
                                        <button
                                            type="submit"
                                            disabled={!inputText.trim() || isLoading}
                                            className="bg-slate-800 text-white p-3 rounded-xl hover:bg-slate-700 disabled:opacity-50 transition-colors"
                                        >
                                            <Send size={20} />
                                        </button>
                                    </form>
                                    <p className="text-center text-xs text-slate-400">
                                        Use "Ayuda en Español" if you get stuck — it's totally okay!
                                    </p>
                                </>
                            )}
                        </div>
                    </div>
                </div>
            );
        };

        // --- MAIN APP ---

        const EMBEDDED_API_KEY = 'AIzaSyB9hwr3UTVpPbLKr1EBy07QvoBh4UkzRMM';

        function App() {
            const [apiKey, setApiKey] = useState(EMBEDDED_API_KEY);
            const [hasKey, setHasKey] = useState(true);
            const [view, setView] = useState('topics');
            const [currentTopic, setCurrentTopic] = useState(null);
            const [messages, setMessages] = useState([]);
            const [inputText, setInputText] = useState('');
            const [isLoading, setIsLoading] = useState(false);
            const [isListening, setIsListening] = useState(false);
            const [listeningLang, setListeningLang] = useState('en-US');
            const [statusMessage, setStatusMessage] = useState('');
            const [turnCount, setTurnCount] = useState(0);
            const [selectedModel, setSelectedModel] = useState("gemini-2.5-flash");
            const [testStatus, setTestStatus] = useState("");

            // ─────────────────────────────────────────────────────────────────
            // FIX #3: VOICE SYSTEM — load voices properly, lock Spanish voice
            // ─────────────────────────────────────────────────────────────────
            const voicesRef = useRef([]);
            const spanishVoiceRef = useRef(null);
            const englishVoiceRef = useRef(null);

            const selectBestVoices = useCallback(() => {
                const available = window.speechSynthesis.getVoices();
                if (available.length === 0) return;
                voicesRef.current = available;

                // Spanish: prefer a real named Spanish voice, locked once found
                const spVoice =
                    available.find(v => v.lang === 'es-MX') ||
                    available.find(v => v.lang === 'es-US') ||
                    available.find(v => v.lang.startsWith('es') && v.name.toLowerCase().includes('google')) ||
                    available.find(v => v.lang.startsWith('es'));
                spanishVoiceRef.current = spVoice || null;

                // English: prefer US English, ideally a natural/Google voice
                const enVoice =
                    available.find(v => v.lang === 'en-US' && (v.name.includes('Natural') || v.name.includes('Google'))) ||
                    available.find(v => v.lang === 'en-US') ||
                    available.find(v => v.lang.startsWith('en'));
                englishVoiceRef.current = enVoice || null;
            }, []);

            useEffect(() => {
                if ('speechSynthesis' in window) {
                    // Voices may already be loaded (Firefox) or load async (Chrome)
                    selectBestVoices();
                    window.speechSynthesis.addEventListener('voiceschanged', selectBestVoices);
                    return () => window.speechSynthesis.removeEventListener('voiceschanged', selectBestVoices);
                }
            }, [selectBestVoices]);

            // speakText now takes explicit lang ('en' | 'es') — no more per-sentence guessing
            const speakText = useCallback((text, lang = 'en') => {
                if (!('speechSynthesis' in window)) return;
                window.speechSynthesis.cancel();

                // Strip markdown, emoji, symbols
                const clean = text
                    .replace(/[*#_`~]/g, '')
                    .replace(/[()\[\]]/g, '')
                    .replace(/[\u{1F300}-\u{1FAFF}]/gu, '')
                    .replace(/[\u{2600}-\u{27BF}]/gu, '')
                    .trim();

                if (!clean) return;

                const utterance = new SpeechSynthesisUtterance(clean);
                utterance.rate = 0.92;
                utterance.pitch = 1.0;

                if (lang === 'es') {
                    utterance.lang = spanishVoiceRef.current?.lang || 'es-MX';
                    if (spanishVoiceRef.current) utterance.voice = spanishVoiceRef.current;
                } else {
                    utterance.lang = englishVoiceRef.current?.lang || 'en-US';
                    if (englishVoiceRef.current) utterance.voice = englishVoiceRef.current;
                }

                window.speechSynthesis.speak(utterance);
            }, []);

            const recognitionRef = useRef(null);
            const handleSendMessageRef = useRef(null);

            useEffect(() => {
                const params = new URLSearchParams(window.location.search);
                const magicKey = params.get('key');
                if (magicKey) setApiKey(magicKey);
            }, []);

            const testConnection = async () => {
                setTestStatus("Testing...");
                try {
                    const res = await fetch(
                        `https://generativelanguage.googleapis.com/v1beta/models/${selectedModel}:generateContent?key=${apiKey}`,
                        { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ contents: [{ parts: [{ text: "Hello" }] }] }) }
                    );
                    if (res.ok) setTestStatus(`Success! ${selectedModel} is ready. ✅`);
                    else { const d = await res.json(); setTestStatus(`Failed: ${d.error?.message || res.status}`); }
                } catch (e) { setTestStatus(`Error: ${e.message}`); }
            };

            useEffect(() => {
                if (!('webkitSpeechRecognition' in window || 'SpeechRecognition' in window)) return;
                const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
                recognitionRef.current = new SR();
                recognitionRef.current.continuous = false;
                recognitionRef.current.interimResults = false;

                recognitionRef.current.onstart = () => { setIsListening(true); setStatusMessage("Listening..."); };
                recognitionRef.current.onresult = (event) => {
                    if (event.results?.[0]) {
                        const transcript = event.results[0][0].transcript;
                        setInputText(transcript);
                        setStatusMessage("Processing...");
                        const isSpanish = recognitionRef.current.lang === 'es-MX';
                        handleSendMessageRef.current?.(transcript, isSpanish);
                    }
                };
                recognitionRef.current.onend = () => setIsListening(false);
                recognitionRef.current.onerror = (event) => {
                    setIsListening(false);
                    if (event.error === 'no-speech') setStatusMessage("No speech detected. Try again.");
                    else if (event.error === 'not-allowed') setStatusMessage("Microphone access denied.");
                    else if (event.error !== 'aborted') setStatusMessage(`Mic error: ${event.error}`);
                    setTimeout(() => setStatusMessage(''), 3000);
                };
                return () => recognitionRef.current?.abort();
            }, []);

            const startListening = (lang) => {
                if (!recognitionRef.current) { alert("Speech recognition not supported. Try Chrome or Edge."); return; }
                if (isListening) { recognitionRef.current.stop(); return; }
                setListeningLang(lang);
                recognitionRef.current.lang = lang;
                try { recognitionRef.current.start(); }
                catch { recognitionRef.current.stop(); }
            };

            // ─────────────────────────────────────────────────────────────────
            // DETECT if AI response is primarily in Spanish (for voice selection)
            // ─────────────────────────────────────────────────────────────────
            const detectResponseLang = (text) => {
                const spanishIndicators = ['¿', '¡', ' es ', ' que ', ' de ', ' la ', ' el ', ' un ', ' una ', ' con ', ' en ', ' lo ', ' las ', ' los '];
                const lowerText = text.toLowerCase();
                const hits = spanishIndicators.filter(w => lowerText.includes(w)).length;
                return hits >= 2 ? 'es' : 'en';
            };

            const handleSendMessage = async (text, wasSpanish = false, isRetry = false) => {
                if (!text.trim() || !currentTopic) return;

                if (!isRetry) {
                    setMessages(prev => [...prev, {
                        id: Date.now(),
                        sender: 'user',
                        text,
                        contextLabel: wasSpanish ? 'You spoke Spanish' : 'You said',
                    }]);
                }

                setMessages(prev => prev.filter(m => !m.isError));
                setInputText('');
                setIsLoading(true);
                setStatusMessage('');

                const newTurnCount = turnCount + 1;
                setTurnCount(newTurnCount);
                const isFinalTurn = newTurnCount >= MAX_TURNS;

                try {
                    // Build a clean history of only text messages (no error/feedback metadata)
                    const cleanHistory = messages
                        .filter(m => m.text && typeof m.text === 'string' && !m.isError)
                        .map(m => ({
                            role: m.sender === 'user' ? 'user' : 'model',
                            parts: [{ text: String(m.text) }]
                        }));

                    let requestBody;

                    if (isFinalTurn) {
                        // Feedback turn: single prompt with full conversation summary
                        const convoHistory = messages
                            .filter(m => m.text && typeof m.text === 'string' && !m.isError)
                            .concat([{ sender: 'user', text }])
                            .map(m => `${m.sender === 'user' ? 'Student' : 'English Buddy'}: ${String(m.text)}`)
                            .join('\n');

                        requestBody = {
                            contents: [{
                                role: 'user',
                                parts: [{ text: buildFeedbackPrompt(convoHistory) }]
                            }]
                        };
                    } else {
                        // Normal turn: system instruction + multi-turn history + new message
                        const userText = wasSpanish
                            ? `${text}\n(Note: student used Spanish — acknowledge warmly and continue in English)`
                            : text;

                        requestBody = {
                            system_instruction: {
                                parts: [{ text: buildSystemPrompt(currentTopic.label) }]
                            },
                            contents: [
                                ...cleanHistory,
                                {
                                    role: 'user',
                                    parts: [{ text: userText }]
                                }
                            ]
                        };
                    }

                    const response = await fetch(
                        `https://generativelanguage.googleapis.com/v1beta/models/${selectedModel}:generateContent?key=${apiKey.trim()}`,
                        {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(requestBody)
                        }
                    );

                    if (!response.ok) {
                        const errData = await response.json().catch(() => ({}));
                        throw new Error(errData.error?.message || `API Error: ${response.status}`);
                    }

                    const data = await response.json();
                    const aiText = data.candidates?.[0]?.content?.parts?.[0]?.text || "Sorry, I didn't catch that.";

                    setMessages(prev => [...prev, {
                        id: Date.now() + 1,
                        sender: 'ai',
                        text: aiText,
                        isFeedback: isFinalTurn
                    }]);

                    // Use explicit lang detection on the AI response for voice
                    const responseLang = detectResponseLang(aiText);
                    speakText(aiText, responseLang);

                } catch (error) {
                    let msg = `Connection error: ${error.message}`;
                    if (error.message.includes("429")) msg = "You're moving fast! Wait about 10 seconds and try again.";
                    setMessages(prev => [...prev, { id: Date.now(), sender: 'ai', text: msg, isError: true }]);
                } finally {
                    setIsLoading(false);
                }
            };

            handleSendMessageRef.current = handleSendMessage;

            return (
                <div className="font-sans text-slate-900 bg-slate-50 min-h-screen">
                    {view === 'welcome' && <WelcomeView apiKey={apiKey} setApiKey={setApiKey} setHasKey={setHasKey} setView={setView} selectedModel={selectedModel} setSelectedModel={setSelectedModel} testConnection={testConnection} testStatus={testStatus} />}
                    {view === 'topics' && <TopicsView setView={setView} setHasKey={setHasKey} setCurrentTopic={setCurrentTopic} setMessages={setMessages} speakText={speakText} setTurnCount={setTurnCount} />}
                    {view === 'chat' && (
                        <ChatView
                            turnCount={turnCount}
                            MAX_TURNS={MAX_TURNS}
                            currentTopic={currentTopic}
                            messages={messages}
                            isLoading={isLoading}
                            statusMessage={statusMessage}
                            isListening={isListening}
                            listeningLang={listeningLang}
                            startListening={startListening}
                            inputText={inputText}
                            setInputText={setInputText}
                            handleSendMessage={handleSendMessage}
                            setView={setView}
                            currentModel={selectedModel}
                            setModel={setSelectedModel}
                        />
                    )}
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
