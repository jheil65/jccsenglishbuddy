<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English Buddy (Demo)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fadeIn 0.5s ease-out forwards; }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="bg-slate-50 h-screen overflow-hidden text-slate-900 font-sans">
    <div id="root" class="h-full"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- MOCKED AI RESPONSES (The "Fake" Brain) ---
        const MOCK_RESPONSES = {
            'default': [
                "That's really interesting! Tell me more about that.",
                "I see! And how does that make you feel?",
                "That sounds cool. Do you do that often?",
                "Wow, I didn't know that! What else?",
                "Great answer! In English, we might also say 'That's awesome.'",
                "I understand completely. Why is that your favorite?"
            ],
            'assessment': [
                "Nice to meet you! How are you feeling today?",
                "I am doing great, thanks for asking! Do you like learning English?",
                "That is wonderful. What is your favorite color?",
                "Blue is a nice color! Do you have any hobbies?",
                "That sounds fun! You are doing a great job speaking English.",
                "[System: Session Complete. Assessment: A2 - Elementary. Great effort!]"
            ]
        };

        const getRandomResponse = (topicId) => {
            const list = MOCK_RESPONSES[topicId] || MOCK_RESPONSES['default'];
            return list[Math.floor(Math.random() * list.length)];
        };

        // --- ICONS ---
        const IconBase = ({ size = 24, className = "", children }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>{children}</svg>
        );
        const Mic = (p) => <IconBase {...p}><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></IconBase>;
        const Send = (p) => <IconBase {...p}><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></IconBase>;
        const Globe = (p) => <IconBase {...p}><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></IconBase>;
        const ArrowLeft = (p) => <IconBase {...p}><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></IconBase>;
        const Sparkles = (p) => <IconBase {...p}><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/></IconBase>;
        const Coffee = (p) => <IconBase {...p}><path d="M18 8h1a4 4 0 0 1 0 8h-1"/><path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z"/><line x1="6" y1="1" x2="6" y2="4"/><line x1="10" y1="1" x2="10" y2="4"/><line x1="14" y1="1" x2="14" y2="4"/></IconBase>;
        const Shirt = (p) => <IconBase {...p}><path d="M20.38 3.46 16 2a4 4 0 0 1-8 0L3.62 3.46a2 2 0 0 0-1.34 2.23l.58 3.47a1 1 0 0 0 .99.84H6v10c0 1.1.9 2 2 2h8a2 2 0 0 0 2-2V10h2.15a1 1 0 0 0 .99-.84l.58-3.47a2 2 0 0 0-1.34-2.23z"/></IconBase>;
        const Trophy = (p) => <IconBase {...p}><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/></IconBase>;
        const Plane = (p) => <IconBase {...p}><path d="M2 12h20"/><path d="M13 2l3.6 7.2h-5.2z"/><path d="M15.4 14.8 19 22"/><path d="M13 14.8V22"/></IconBase>;
        const Camera = (p) => <IconBase {...p}><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></IconBase>;
        const Tv = (p) => <IconBase {...p}><rect x="2" y="7" width="20" height="15" rx="2" ry="2"/><polyline points="17 2 12 7 7 2"/></IconBase>;
        const Music = (p) => <IconBase {...p}><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></IconBase>;
        const MessageCircle = (p) => <IconBase {...p}><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></IconBase>;
        const Gamepad = (p) => <IconBase {...p}><line x1="6" y1="12" x2="10" y2="12"/><line x1="8" y1="10" x2="8" y2="14"/><line x1="15" y1="13" x2="15.01" y2="13"/><rect x="2" y="6" width="20" height="12" rx="2"/></IconBase>;
        const Star = (p) => <IconBase {...p}><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></IconBase>;

        const TOPICS = [
            { id: 'assessment', label: 'Start Here (Level Check)', icon: Star, color: 'bg-yellow-100 text-yellow-600', prompt: "Hi! I'm English Buddy. What is your name?" },
            { id: 'entertainment', label: 'Netflix & Anime', icon: Tv, color: 'bg-red-100 text-red-600', prompt: "Let's talk shows! Are you watching any good anime or series right now?" },
            { id: 'sports', label: 'Sports & Gaming', icon: Gamepad, color: 'bg-emerald-100 text-emerald-600', prompt: "Gaming or Sports? Which do you prefer playing or watching?" },
            { id: 'music', label: 'Music & Vibes', icon: Music, color: 'bg-teal-100 text-teal-600', prompt: "What's on your playlist? Who is your favorite artist right now?" },
            { id: 'food', label: 'Snacks & Food', icon: Coffee, color: 'bg-orange-100 text-orange-600', prompt: "If you could eat any snack right now, what would it be? Takis? Pizza?" },
            { id: 'fashion', label: 'Style & Trends', icon: Shirt, color: 'bg-pink-100 text-pink-600', prompt: "Let's talk style. Do you like sneakers, hoodies, or something else?" },
            { id: 'travel', label: 'Dream Trips', icon: Plane, color: 'bg-blue-100 text-blue-600', prompt: "If you could fly anywhere with your friends tomorrow, where would you go?" },
            { id: 'hobbies', label: 'Hobbies', icon: Camera, color: 'bg-purple-100 text-purple-600', prompt: "What do you do when you're not at school? Do you draw, play, or hang out?" },
            { id: 'daily', label: 'School & Friends', icon: MessageCircle, color: 'bg-indigo-100 text-indigo-600', prompt: "How is school going? What's the best (or worst) part of your week?" },
        ];

        const TopicCard = ({ topic, onSelect }) => (
            <button onClick={() => onSelect(topic)} className={`flex flex-col items-center justify-center p-6 rounded-2xl shadow-sm hover:shadow-md transition-all duration-300 border border-slate-100 hover:-translate-y-1 bg-white group`}>
                <div className={`p-4 rounded-full mb-4 ${topic.color} bg-opacity-20 group-hover:bg-opacity-30 transition-colors`}>
                <topic.icon size={32} strokeWidth={1.5} />
                </div>
                <span className="font-semibold text-slate-700 text-lg">{topic.label}</span>
            </button>
        );

        const ChatBubble = ({ message }) => {
            const isUser = message.sender === 'user';
            return (
                <div className={`flex w-full mb-4 ${isUser ? 'justify-end' : 'justify-start'}`}>
                <div className={`max-w-[85%] sm:max-w-[75%] p-4 rounded-2xl shadow-sm text-base leading-relaxed ${isUser ? 'bg-blue-600 text-white rounded-br-none' : 'bg-white border border-slate-100 text-slate-800 rounded-bl-none'}`}>
                    <p>{message.text}</p>
                </div>
                </div>
            );
        };

        const WelcomeView = ({ setView }) => (
            <div className="flex flex-col items-center justify-center min-h-[60vh] text-center p-6 animate-fade-in relative">
                <div className="absolute top-0 right-0 p-4 text-xs text-slate-300 font-mono">vDemo (Offline)</div>
                <div className="bg-blue-100 p-6 rounded-full mb-6"><Globe size={64} className="text-blue-600" /></div>
                <h1 className="text-4xl font-bold text-slate-800 mb-4 tracking-tight">English Buddy (Demo)</h1>
                <p className="text-lg text-slate-600 max-w-md mb-8">This version works OFFLINE for demonstrations. No API Key required.</p>
                <button onClick={() => setView('topics')} className="bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-8 rounded-xl shadow-lg transition-colors">Start Demo</button>
            </div>
        );

        function App() {
            const [view, setView] = useState('welcome');
            const [currentTopic, setCurrentTopic] = useState(null);
            const [messages, setMessages] = useState([]);
            const [inputText, setInputText] = useState('');
            const [isLoading, setIsLoading] = useState(false);
            const chatEndRef = useRef(null);

            useEffect(() => { chatEndRef.current?.scrollIntoView({ behavior: 'smooth' }); }, [messages]);

            const speakText = (text) => {
                if ('speechSynthesis' in window) {
                    window.speechSynthesis.cancel();
                    const utterance = new SpeechSynthesisUtterance(text);
                    utterance.lang = 'en-US';
                    window.speechSynthesis.speak(utterance);
                }
            };

            const handleSendMessage = async (text) => {
                if (!text.trim()) return;
                const userMsg = { id: Date.now(), sender: 'user', text: text };
                setMessages(prev => [...prev, userMsg]);
                setInputText('');
                setIsLoading(true);

                // SIMULATE AI THINKING TIME
                setTimeout(() => {
                    const aiResponse = getRandomResponse(currentTopic.id);
                    const aiMsg = { id: Date.now() + 1, sender: 'ai', text: aiResponse };
                    setMessages(prev => [...prev, aiMsg]);
                    speakText(aiResponse);
                    setIsLoading(false);
                }, 1000);
            };

            return (
                <div className="font-sans text-slate-900 bg-slate-50 min-h-screen">
                    {view === 'welcome' && <WelcomeView setView={setView} />}
                    {view === 'topics' && (
                        <div className="p-8 max-w-5xl mx-auto animate-fade-in">
                             <div className="flex items-center justify-between mb-8">
                                <h2 className="text-3xl font-bold text-slate-800">Choose a Topic</h2>
                                <button onClick={() => setView('welcome')} className="text-slate-400">Back</button>
                            </div>
                            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                                {TOPICS.map(topic => (
                                    <TopicCard key={topic.id} topic={topic} onSelect={(t) => {
                                        setCurrentTopic(t);
                                        setMessages([{ id: 'init', sender: 'ai', text: `Hi! ${t.prompt}` }]);
                                        speakText(`Hi! ${t.prompt}`);
                                        setView('chat');
                                    }} />
                                ))}
                            </div>
                        </div>
                    )}
                    {view === 'chat' && (
                        <div className="flex flex-col h-screen max-h-screen bg-slate-50">
                            <div className="bg-white border-b border-slate-200 p-4 flex items-center gap-3 shadow-sm">
                                <button onClick={() => setView('topics')}><ArrowLeft size={24} /></button>
                                <h3 className="font-bold text-slate-800">{currentTopic.label}</h3>
                            </div>
                            <div className="flex-1 overflow-y-auto p-4 space-y-4">
                                {messages.map(msg => <ChatBubble key={msg.id} message={msg} />)}
                                {isLoading && <div className="text-sm text-slate-400 p-2">English Buddy is thinking...</div>}
                                <div ref={chatEndRef} />
                            </div>
                            <div className="bg-white border-t border-slate-200 p-4">
                                <form onSubmit={(e) => { e.preventDefault(); handleSendMessage(inputText); }} className="flex gap-2 max-w-3xl mx-auto">
                                    <input type="text" value={inputText} onChange={(e) => setInputText(e.target.value)} className="flex-1 p-3 border rounded-xl" placeholder="Type a message..." />
                                    <button type="submit" className="bg-slate-800 text-white p-3 rounded-xl"><Send size={20} /></button>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
